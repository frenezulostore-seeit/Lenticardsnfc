<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Persoonlijke Video</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
        }
        /* Het kruisje linksboven */
        .close-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background-color: rgba(0, 0, 0, 0.5);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            font-size: 28px;
            font-weight: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            text-decoration: none;
            line-height: 1;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .close-btn:active {
            background-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Sluitknop / kruisje -->
        <a href="#" class="close-btn" onclick="closePage(event)" aria-label="Sluiten">&times;</a>
        
        <!-- Video element met controls zodat de gebruiker op play drukt -->
        <video id="nfcVideo" controls playsinline preload="auto">
            <source src="Verjjaardag.mp4" type="video/mp4">
            Je browser ondersteunt geen video-element.
        </video>
    </div>

    <script>
        function closePage(e) {
            e.preventDefault();
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.close();
            }
        }
    </script>

</body>
</html>
