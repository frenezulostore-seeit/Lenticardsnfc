<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A simple Messge for you</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle, #1a1a3a 0%, #0a0a16 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card-container {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 215, 0, 0.3);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      max-width: 450px;
      width: 100%;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      color: #ffd700;
      margin-bottom: 15px;
      font-weight: 600;
    }
    .media-box {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 2px solid #ffd700;
      background-color: #000;
    }
    .media-box video, .media-box img {
      width: 100%;
      height: auto;
      display: block;
    }
    .message-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 18px;
      border-radius: 10px;
      border-left: 4px solid #ffd700;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #e0e0e0;
      margin-bottom: 20px;
      white-space: pre-line;
      text-align: left;
    }
    .sender {
      font-weight: bold;
      color: #ffd700;
      margin-top: 10px;
      display: block;
      text-align: right;
    }
    .footer {
      font-size: 0.8rem;
      color: #8888aa;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <h1>✨ A simple Messge for you ✨</h1>

    <div class="media-box">
      <img src="media.jpg" alt="Persoonlijke foto">
    </div>

    <div class="message-box">
      Gefeliciteerd met je verjaardag! 🥳

Hopelijk heb je een geweldige dag vol verrassingen en plezier!
      <span class="sender">— Liefs, Anna & Tom</span>
    </div>

    <div class="footer">
      Afgespeeld via jouw Lenticulaire NFC Kaart
    </div>
  </div>

</body>
</html>
