<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Persoonlijke Video</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
        }
        /* Het kruisje linksboven */
        .close-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background-color: rgba(0, 0, 0, 0.5);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            font-size: 28px;
            font-weight: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            text-decoration: none;
            line-height: 1;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .close-btn:active {
            background-color: rgba(255, 255, 255, 0.3);
        }
        /* Centrale afspeelknop (alleen bij de start) */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            z-index: 900;
            transition: opacity 0.3s ease;
        }
        .play-button {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }
        .play-overlay:hover .play-button {
            transform: scale(1.1);
        }
        .play-triangle {
            width: 0;
            height: 0;
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            border-left: 30px solid #000000;
            margin-left: 6px;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Sluitknop / kruisje -->
        <a href="#" class="close-btn" onclick="closePage(event)" aria-label="Sluiten">&times;</a>
        
        <!-- Start Play Overlay -->
        <div id="playOverlay" class="play-overlay" onclick="playVideo()">
            <div class="play-button">
                <div class="play-triangle"></div>
            </div>
        </div>

        <!-- Video element -->
        <video id="nfcVideo" playsinline preload="auto">
            <source src="Verjjaardag.mp4" type="video/mp4">
            Je browser ondersteunt geen video-element.
        </video>
    </div>

    <script>
        const video = document.getElementById('nfcVideo');
        const overlay = document.getElementById('playOverlay');

        function playVideo() {
            video.play();
            overlay.classList.add('hidden');
        }

        // Zodra de video klaar is met afspelen, zorgen we dat de mobiele browser 
        // geen standaard pauzeknop toont door het element subtiel te beheren.
        video.addEventListener('ended', function() {
            // De video blijft nu netjes op het eindbeeld (de boodschap) staan.
            // Als de gebruiker op het scherm tikt, start hij opnieuw van voren af aan.
        });

        video.addEventListener('click', function() {
            if (video.ended) {
                video.currentTime = 0;
                video.play();
            } else if (video.paused && !overlay.classList.contains('hidden')) {
                playVideo();
            } else if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        });

        function closePage(e) {
            e.preventDefault();
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.close();
            }
        }
    </script>

</body>
</html>
